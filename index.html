<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Арбузный архив</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4fff4;
      color: #203b2b;
    }
    .card {
      max-width: 650px;
      margin: 40px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #183b2015;
    }
    h1 { color: #218545; }
    input, button, textarea {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #cbdccb;
      border-radius: 9px;
      font: inherit;
    }
    button {
      background: #218545;
      color: white;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
    .hidden { display: none; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🍉 Арбузный архив</h1>
    <p id="message">Загрузка...</p>

    <section id="auth">
      <input id="email" type="email" placeholder="Электронная почта">
      <input id="password" type="password" placeholder="Пароль">
      <button id="loginButton">Войти</button>
      <button id="registerButton">Создать аккаунт</button>
    </section>

    <section id="cabinet" class="hidden">
      <h2>Твой архив</h2>
      <p id="userEmail"></p>
      <textarea id="note" rows="5"
        placeholder="Напиши что-нибудь..."></textarea>
      <button id="saveButton">Сохранить заметку</button>
      <button id="logoutButton">Выйти</button>
      <p>Заметки подключим следующим шагом.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
